# Replace /srv/namaste-bharat and install TLS certificates before enabling these blocks.
# Main website is intentionally not configured here.
server {
    listen 80;
    server_name crm.namastebharat24.com api.namastebharat24.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name crm.namastebharat24.com;
    ssl_certificate /etc/letsencrypt/live/crm.namastebharat24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.namastebharat24.com/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name api.namastebharat24.com;
    ssl_certificate /etc/letsencrypt/live/api.namastebharat24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.namastebharat24.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { return 404; }
}
